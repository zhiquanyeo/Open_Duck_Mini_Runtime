[build-system]
requires = ["uv_build>=0.1,<0.12"]
build-backend = "uv_build"

[project]
name = "duck-remote"
version = "0.1.0"
description = "PC-side gamepad relay for Open Duck Mini remote control"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pygame==2.6.0",
]

[project.scripts]
duck-remote = "duck_remote.relay:main"
duck-remote-fake-host = "duck_remote.fake_host:main"
duck-remote-eyes = "duck_remote.eyes_cli:main"
duck-remote-telemetry = "duck_remote.telemetry_cli:main"
